name: Build Android APK

on:
  push:
    branches: [main, master, ccr-eb2e784e-6s5cdt]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/model-en-us
          key: vosk-model-small-en-us-0.15

      - name: Download on-device speech model
        run: ./scripts/fetch-speech-model.sh

      - name: Install & sync web assets into Android project
        run: |
          npm ci
          npm run sync

      - name: Restore signing keystore from secrets
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            # No permanent key yet: sign with a throwaway key so the build is still
            # checked, but don't publish a release (it couldn't be updated later).
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set - building a test APK only, no release. See README.md (Signing key)."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias wordcards \
              -keyalg RSA -keysize 2048 -validity 365 -storepass temp-key -keypass temp-key -dname "CN=Test build"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.signed == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || 'temp-key' }}
          KEY_ALIAS: ${{ steps.keystore.outputs.signed == 'true' && (secrets.ANDROID_KEY_ALIAS || 'wordcards') || 'wordcards' }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.signed == 'true' && (secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD) || 'temp-key' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/word-cards.apk"
          ls -lh "$GITHUB_WORKSPACE/word-cards.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: word-cards-apk
          path: word-cards.apk

      - name: Publish GitHub Release
        if: steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Word Cards 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: word-cards.apk
