<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <title>Word Cards</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home: pick a color set -->
  <section id="home" class="screen">
    <button id="settingsBtn" class="icon-btn home-settings" type="button" aria-label="Settings">⚙️</button>
    <button id="kidLock" class="icon-btn lock-btn" type="button" aria-label="Kid lock" aria-pressed="false" hidden>🔓</button>
    <h1 class="title">Word Cards</h1>
    <div id="profiles" class="profiles"></div>
    <div id="sets" class="sets"></div>
    <div class="footer">
      <button id="micToggle" class="icon-btn home-mic" type="button" aria-label="Voice on/off" aria-pressed="true" hidden>🎤</button>
      <div id="voiceStatus" class="voice-status"></div>
    </div>
  </section>

  <!-- Settings of the current reader. While kid lock is on, only the fox
       can be changed (the "grown" rows are hidden). -->
  <section id="settings" class="screen" hidden>
    <header class="topbar">
      <button id="settingsHome" class="icon-btn" type="button" aria-label="Home">🏠</button>
      <h2 id="settingsTitle" class="settings-title"></h2>
      <span class="icon-spacer"></span>
    </header>
    <div class="settings">
      <div class="setting grown">
        <span class="setting-label">Name</span>
        <button id="profileName" class="setting-btn" type="button"></button>
      </div>
      <div class="setting">
        <span class="setting-label">Fox</span>
        <div id="foxChoices" class="fox-choices"></div>
      </div>
      <div id="listenRow" class="setting grown">
        <span class="setting-label">Listening time</span>
        <button id="listenTime" class="setting-btn" type="button"></button>
      </div>
      <div class="setting grown">
        <span class="setting-label">Buttons in landscape</span>
        <div class="seg" role="group" aria-label="Buttons in landscape">
          <button id="sideLeft" class="seg-btn" type="button">⬅ Left</button>
          <button id="sideRight" class="seg-btn" type="button">Right ➡</button>
        </div>
      </div>
      <div class="setting grown">
        <span class="setting-label">Progress</span>
        <button id="reset" class="setting-btn danger" type="button">Reset progress</button>
        <button id="removeProfile" class="setting-btn danger" type="button"></button>
      </div>
      <div id="pinRow" class="setting grown">
        <span class="setting-label">Kid lock (all readers)</span>
        <button id="changePin" class="setting-btn" type="button">Change grown-up PIN</button>
      </div>
    </div>
  </section>

  <!-- Grown-up PIN for the kid lock (also used to name profiles) -->
  <div id="pinDialog" class="pin-dialog" hidden>
    <form id="pinForm" class="pin-box">
      <h2 id="pinTitle" class="pin-title"></h2>
      <p id="pinHint" class="pin-hint"></p>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
             autocomplete="off" maxlength="8" aria-labelledby="pinTitle">
      <div id="pinError" class="pin-error" aria-live="polite"></div>
      <div class="pin-actions">
        <button id="pinCancel" class="big-btn secondary" type="button">Cancel</button>
        <button class="big-btn go" type="submit">OK</button>
      </div>
    </form>
  </div>

  <!-- Study: one-sided cards, hands-free -->
  <section id="study" class="screen" hidden>
    <header class="topbar">
      <button id="homeBtn" class="icon-btn" type="button" aria-label="Home">🏠</button>
      <!-- How far through this round: fills up as words are read -->
      <div id="progress" class="progress" role="progressbar" aria-label="Words read" aria-valuemin="0">
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <span class="progress-goal" aria-hidden="true">⭐</span>
      </div>
      <span class="icon-spacer"></span>
    </header>

    <div class="card-area">
      <div id="card" class="card">
        <div class="face"><div class="frame">
          <span class="word" id="word"></span>
        </div></div>
      </div>
    </div>

    <div class="listen idle" id="listen">
      <span class="mic" id="micIcon">🎤</span>
      <div class="timebar"><div id="timefill" class="timefill"></div></div>
    </div>

    <div class="controls">
      <!-- Picture-only buttons: the kids can't read yet -->
      <button id="dontKnow" class="dontknow-btn" type="button" aria-label="Don't know (hear the word)">
        <span class="q q1" aria-hidden="true">?</span><span class="btn-icon" aria-hidden="true">🤷</span><span class="q q2" aria-hidden="true">?</span>
      </button>
      <button id="gotIt" class="gotit-btn" type="button" aria-label="Got it" hidden>
        <span class="btn-icon" aria-hidden="true">😊</span>
      </button>
    </div>
  </section>

  <!-- Finished: the stars earned this round pop in one by one above the
       fox, who celebrates more with every star. -->
  <section id="done" class="screen" hidden>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <div class="done-stage">
      <div id="stars" class="stars" role="img"></div>
      <div id="doneFox" class="done-fox fox wait"></div>
      <h2 id="doneTitle" class="done-title">Great job!</h2>
    </div>
    <div class="done-actions">
      <button id="moreBtn" class="big-btn go" type="button">Keep going ▶</button>
      <button id="allBtn" class="big-btn secondary" type="button">All the words</button>
      <button id="doneHome" class="big-btn secondary" type="button">🏠 Home</button>
    </div>
  </section>

  <!-- The reader's fox: waits excitedly, celebrates, and cheers you on.
       Drawn from avatars.js in the style the reader picked. -->
  <div id="ember" class="ember fox wait" hidden></div>

  <script src="capacitor.js"></script>
  <script src="words.js"></script>
  <script src="avatars.js"></script>
  <script src="app.js"></script>
</body>
</html>
