<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <title>Word Cards</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home: pick a color set -->
  <section id="home" class="screen">
    <button id="micToggle" class="icon-btn home-mic" type="button" aria-label="Voice on/off" aria-pressed="true" hidden>🎤</button>
    <h1 class="title">Word Cards</h1>
    <div id="profiles" class="profiles"></div>
    <button id="foxBtn" class="fox-btn" type="button" aria-label="Pick a fox"></button>
    <div id="sets" class="sets"></div>
    <div class="footer">
      <button id="kidLock" class="lock-btn" type="button" hidden>🔒 Kid lock</button>
      <div id="voiceStatus" class="voice-status"></div>
      <button id="listenTime" class="link-btn" type="button" hidden></button>
      <button id="buttonsSide" class="link-btn" type="button" hidden></button>
      <button id="reset" class="link-btn" type="button">Reset progress</button>
      <button id="changePin" class="link-btn" type="button" hidden>Change PIN</button>
      <button id="removeProfile" class="link-btn" type="button" hidden></button>
    </div>
  </section>

  <!-- Grown-up PIN for the kid lock (also used to name profiles) -->
  <div id="pinDialog" class="pin-dialog" hidden>
    <form id="pinForm" class="pin-box">
      <h2 id="pinTitle" class="pin-title"></h2>
      <p id="pinHint" class="pin-hint"></p>
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*"
             autocomplete="off" maxlength="8" aria-labelledby="pinTitle">
      <div id="pinError" class="pin-error" aria-live="polite"></div>
      <div class="pin-actions">
        <button id="pinCancel" class="big-btn secondary" type="button">Cancel</button>
        <button class="big-btn go" type="submit">OK</button>
      </div>
    </form>
  </div>

  <!-- Study: one-sided cards, hands-free -->
  <section id="study" class="screen" hidden>
    <header class="topbar">
      <button id="homeBtn" class="icon-btn" type="button" aria-label="Home">🏠</button>
      <div id="left" class="left-count"></div>
      <span class="icon-spacer"></span>
    </header>

    <div class="card-area">
      <div id="card" class="card">
        <div class="face"><div class="frame">
          <span class="word" id="word"></span>
        </div></div>
      </div>
    </div>

    <div class="listen idle" id="listen">
      <span class="mic" id="micIcon">🎤</span>
      <div class="timebar"><div id="timefill" class="timefill"></div></div>
    </div>

    <div class="controls">
      <!-- Picture-only buttons: the kids can't read yet -->
      <button id="dontKnow" class="dontknow-btn" type="button" aria-label="Don't know (hear the word)">
        <span class="q q1" aria-hidden="true">?</span><span class="btn-icon" aria-hidden="true">🤷</span><span class="q q2" aria-hidden="true">?</span>
      </button>
      <button id="gotIt" class="gotit-btn" type="button" aria-label="Got it" hidden>
        <span class="btn-icon" aria-hidden="true">😊</span>
      </button>
    </div>
  </section>

  <!-- Finished -->
  <section id="done" class="screen" hidden>
    <div class="party">🎉</div>
    <h2 class="done-title">Great job!</h2>
    <button id="moreBtn" class="big-btn go" type="button">Keep going ▶</button>
    <button id="allBtn" class="big-btn secondary" type="button">All the words</button>
    <button id="doneHome" class="big-btn secondary" type="button">🏠 Home</button>
  </section>

  <!-- The reader's fox: waits excitedly, celebrates, and cheers you on.
       Drawn from avatars.js in the style the reader picked. -->
  <div id="ember" class="ember fox wait" hidden></div>

  <!-- Pick a fox style for the current reader -->
  <div id="foxDialog" class="pin-dialog" hidden>
    <div class="pin-box fox-box" role="dialog" aria-labelledby="foxTitle">
      <h2 id="foxTitle" class="pin-title">Pick your fox</h2>
      <div id="foxChoices" class="fox-choices"></div>
      <div class="pin-actions">
        <button id="foxCancel" class="big-btn secondary" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="capacitor.js"></script>
  <script src="words.js"></script>
  <script src="avatars.js"></script>
  <script src="app.js"></script>
</body>
</html>
