<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <title>Word Cards</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home: pick a color set -->
  <section id="home" class="screen">
    <h1 class="title">Word Cards</h1>
    <div id="sets" class="sets"></div>
    <div class="footer">
      <div id="voiceStatus" class="voice-status"></div>
      <button id="reset" class="link-btn" type="button">Reset progress</button>
    </div>
  </section>

  <!-- Study: one-sided cards, hands-free -->
  <section id="study" class="screen" hidden>
    <header class="topbar">
      <button id="homeBtn" class="icon-btn" type="button" aria-label="Home">🏠</button>
      <div id="left" class="left-count"></div>
      <button id="micToggle" class="icon-btn" type="button" aria-label="Voice on/off" hidden>🎤</button>
    </header>

    <div class="card-area">
      <div id="card" class="card">
        <div class="face"><div class="frame">
          <span class="word" id="word"></span>
          <button id="hintBtn" class="speaker" type="button" aria-label="Say the word">🔊</button>
        </div></div>
      </div>
    </div>

    <div class="listen" id="listen">
      <span class="mic" id="micIcon">🎤</span>
      <div class="timebar"><div id="timefill" class="timefill"></div></div>
    </div>

    <div class="controls">
      <div id="rateBtns" class="rate">
        <button class="rate-btn again" data-rating="again" type="button"><span class="emoji">😟</span>Again</button>
        <button class="rate-btn hard"  data-rating="hard"  type="button"><span class="emoji">🤔</span>Hard</button>
        <button class="rate-btn good"  data-rating="good"  type="button"><span class="emoji">🙂</span>Good</button>
        <button class="rate-btn easy"  data-rating="easy"  type="button"><span class="emoji">🤩</span>Easy</button>
      </div>
    </div>
  </section>

  <!-- Finished -->
  <section id="done" class="screen" hidden>
    <div class="party">🎉</div>
    <h2 class="done-title">Great job!</h2>
    <button id="moreBtn" class="big-btn go" type="button">Keep going ▶</button>
    <button id="allBtn" class="big-btn secondary" type="button">All the words</button>
    <button id="doneHome" class="big-btn secondary" type="button">🏠 Home</button>
  </section>

  <script src="capacitor.js"></script>
  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
